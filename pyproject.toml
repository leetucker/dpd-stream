[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dpd-stream"
version = "0.1.0"
description = "Out-of-core dynamic panel GMM: Arellano-Bond difference GMM and Blundell-Bond system GMM, by streamed passes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Lee Tucker" }]
keywords = ["econometrics", "dynamic panel", "GMM", "Arellano-Bond", "Blundell-Bond",
            "system GMM", "xtabond2", "out-of-core", "panel data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    # the row store, run directories, the formula compiler and the result
    # base classes (hdfe_stream.core's stable names)
    "hdfe-stream[formula]>=0.6.2",
    "polars>=1.37,!=1.41.*",
    "numpy>=1.24",
    "numba>=0.59",
    "pyarrow>=14.0",
    "scipy>=1.11",
    # keeps BLAS to one thread during passes that run numba's parallel kernels
    "threadpoolctl>=3.1",
]

[project.urls]
Homepage = "https://github.com/leetucker/dpd-stream"
Source = "https://github.com/leetucker/dpd-stream"
Issues = "https://github.com/leetucker/dpd-stream/issues"
Documentation = "https://leetucker.github.io/dpd-stream/"
Changelog = "https://github.com/leetucker/dpd-stream/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# benchmarks/: matplotlib for the figures; pydynpd and the R packages live in
# their own environments (see benchmarks/README.md)
benchmark = [
    "matplotlib>=3.7",
    "pandas>=2.0",
]
# docs/: the documentation site, built with Sphinx (see docs/conf.py)
docs = [
    "sphinx>=8.0",
    "myst-parser>=4.0",
    "furo>=2024.8.6",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
]
test = [
    "pytest>=7.0",
    "pandas>=2.0",
]

[tool.setuptools.package-data]
dpd_stream = ["py.typed"]

[tool.setuptools.packages.find]
include = ["dpd_stream*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# the benchmarks' R and pydynpd environments
extend-exclude = ["benchmarks/external/.r", "benchmarks/external/.pydynpd"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905", "E741"]
